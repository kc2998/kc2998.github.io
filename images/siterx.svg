<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#e8eefc"/>

  <!-- Clinical note (unstructured text) -->
  <g transform="translate(40,70)">
    <rect width="170" height="220" rx="10" fill="#ffffff" stroke="#c7d3f5" stroke-width="2"/>
    <rect x="16" y="18" width="80" height="10" rx="5" fill="#1d4ed8" opacity="0.85"/>
    <rect x="16" y="46" width="138" height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="62" width="120" height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="78" width="132" height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="94" width="96"  height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="118" width="138" height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="134" width="70"  height="7" rx="3.5" fill="#f59e0b"/>
    <rect x="92" y="134" width="62"  height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="150" width="128" height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="16" y="174" width="50"  height="7" rx="3.5" fill="#cbd2e1"/>
    <rect x="72" y="174" width="56"  height="7" rx="3.5" fill="#10b981"/>
    <rect x="16" y="190" width="110" height="7" rx="3.5" fill="#cbd2e1"/>
  </g>
  <text x="125" y="320" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Clinical notes</text>

  <!-- Arrow in -->
  <path d="M226 180 H262" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 172 L266 180 L256 188" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Model node -->
  <g transform="translate(276,120)">
    <rect width="88" height="120" rx="14" fill="#1d4ed8"/>
    <circle cx="26" cy="36" r="7" fill="#ffffff"/>
    <circle cx="62" cy="36" r="7" fill="#ffffff"/>
    <circle cx="44" cy="62" r="7" fill="#ffffff"/>
    <circle cx="26" cy="88" r="7" fill="#ffffff"/>
    <circle cx="62" cy="88" r="7" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.7">
      <line x1="26" y1="36" x2="44" y2="62"/>
      <line x1="62" y1="36" x2="44" y2="62"/>
      <line x1="44" y1="62" x2="26" y2="88"/>
      <line x1="44" y1="62" x2="62" y2="88"/>
      <line x1="26" y1="36" x2="62" y2="36"/>
      <line x1="26" y1="88" x2="62" y2="88"/>
    </g>
  </g>
  <text x="320" y="320" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">NLP / LLM</text>

  <!-- Arrow out -->
  <path d="M378 180 H414" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <path d="M408 172 L418 180 L408 188" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Structured table -->
  <g transform="translate(430,90)">
    <rect width="170" height="180" rx="10" fill="#ffffff" stroke="#c7d3f5" stroke-width="2"/>
    <rect width="170" height="34" rx="10" fill="#1d4ed8"/>
    <rect y="24" width="170" height="10" fill="#1d4ed8"/>
    <line x1="85" y1="0" x2="85" y2="180" stroke="#c7d3f5" stroke-width="2"/>
    <rect x="14" y="13" width="50" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="99" y="13" width="50" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="0" y1="70" x2="170" y2="70"/>
      <line x1="0" y1="106" x2="170" y2="106"/>
      <line x1="0" y1="142" x2="170" y2="142"/>
    </g>
    <rect x="14" y="48" width="54" height="8" rx="4" fill="#cbd2e1"/>
    <rect x="99" y="48" width="44" height="8" rx="4" fill="#f59e0b"/>
    <rect x="14" y="84" width="44" height="8" rx="4" fill="#cbd2e1"/>
    <rect x="99" y="84" width="56" height="8" rx="4" fill="#10b981"/>
    <rect x="14" y="120" width="58" height="8" rx="4" fill="#cbd2e1"/>
    <rect x="99" y="120" width="38" height="8" rx="4" fill="#cbd2e1"/>
    <rect x="14" y="156" width="40" height="8" rx="4" fill="#cbd2e1"/>
    <rect x="99" y="156" width="50" height="8" rx="4" fill="#cbd2e1"/>
  </g>
  <text x="515" y="320" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Structured data</text>
</svg>
